<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar · PCAP Analyzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0c; --card:#131316; --border:#232329; --brand:#9B7CFF; --text:#e9eaea; --text2:#898989; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); font-family:"DM Sans",system-ui,sans-serif; }
  .card { width:380px; max-width:92vw; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .brand svg { flex:none; }
  .brand .t1 { font-size:15px; font-weight:600; color:#fff; }
  .brand .t2 { font-size:11px; color:var(--text2); }
  h1 { font-size:16px; font-weight:600; margin:0 0 4px; }
  p.sub { font-size:12.5px; color:var(--text2); margin:0 0 20px; }
  label { display:block; font-size:12px; color:var(--text2); margin:14px 0 6px; }
  input { width:100%; background:#0d0d10; border:1px solid var(--border); border-radius:8px; padding:10px 12px;
    color:var(--text); font-size:13.5px; font-family:inherit; }
  input:focus { outline:2px solid var(--brand); outline-offset:1px; border-color:transparent; }
  button[type=submit] { width:100%; margin-top:20px; background:var(--brand); color:#14101f; border:none;
    border-radius:8px; padding:10px 14px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  button[type=submit]:hover { filter:brightness(1.08); }
  button[type=submit]:disabled { opacity:.6; cursor:default; }
  .err { margin-top:14px; font-size:12.5px; color:#f87171; background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.3);
    border-radius:8px; padding:8px 10px; display:none; }
  .hint { margin-top:16px; font-size:11.5px; color:var(--text2); line-height:1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 34 34" fill="none" aria-hidden="true">
        <rect width="34" height="34" rx="8" fill="#9B7CFF"/>
        <path d="M17 7.5 L24.5 10.8 V16.2 C24.5 21.3 21.3 24.9 17 26.5 C12.7 24.9 9.5 21.3 9.5 16.2 V10.8 Z" stroke="white" stroke-width="1.7" stroke-linejoin="round" fill="none"/>
        <circle cx="14" cy="15.5" r="1.7" fill="white"/><circle cx="20" cy="15.5" r="1.7" fill="white"/><circle cx="17" cy="21" r="1.7" fill="white"/>
      </svg>
      <div><div class="t1">PCAP Analyzer</div><div class="t2">NetSec · Proteção DDoS</div></div>
    </div>

    <h1 id="formTitle">Entrar</h1>
    <p class="sub" id="formSub">Acesso restrito ao time.</p>

    <form id="loginForm">
      <div id="nameField" style="display:none">
        <label for="name">Nome</label>
        <input id="name" type="text" autocomplete="name">
      </div>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Entrar</button>
      <div class="err" id="errBox"></div>
    </form>
    <div class="hint" id="setupHint" style="display:none">
      Nenhuma conta cadastrada ainda: esta primeira conta será a de administrador.
      Depois, use o painel "Usuários" dentro do sistema para cadastrar os analistas.
    </div>
  </div>

<script>
(async function () {
  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('errBox');
  const submitBtn = document.getElementById('submitBtn');
  const nameField = document.getElementById('nameField');
  const setupHint = document.getElementById('setupHint');
  let isSetup = false;

  try {
    const r = await fetch('/api/setup');
    const d = await r.json();
    isSetup = !!d.needsSetup;
  } catch (e) {}

  if (isSetup) {
    document.getElementById('formTitle').textContent = 'Criar conta de administrador';
    document.getElementById('formSub').textContent = 'Primeiro acesso: defina a conta do administrador.';
    nameField.style.display = 'block';
    document.getElementById('name').required = true;
    document.getElementById('password').autocomplete = 'new-password';
    submitBtn.textContent = 'Criar conta';
    setupHint.style.display = 'block';
  }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    errBox.style.display = 'none';
    submitBtn.disabled = true;
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const name = document.getElementById('name').value.trim();

    try {
      const url = isSetup ? '/api/setup' : '/api/auth/login';
      const body = isSetup ? { email, password, name } : { email, password };
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || 'Falha ao entrar.');
      window.location.href = '/index.html';
    } catch (e) {
      errBox.textContent = e.message;
      errBox.style.display = 'block';
      submitBtn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
